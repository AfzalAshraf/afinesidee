<!doctype html>
<!--
  Sidee Enhanced — generated TV dashboard template.

  Served at http://<computer-ip>:<port>/dashboard (access key required).
  webui.render_tv_dashboard() replaces __SIDEE_DATA__ with a JSON blob
  containing the user's tiles and dashboard configuration, so the delivered
  HTML is genuinely "generated" for that user while this file stays a clean,
  reviewable template. No external scripts, fonts, trackers or cloud calls.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Sidee Dashboard</title>
<style>
  :root{
    color-scheme:dark; --accent:#ffe600; --accent2:#7c5cff;
    --bg:#0b0d12; --tile:#171b25; --tile-hi:#202636; --ink:#f4f6fb;
    --muted:#98a0b3; --cols:4; --gap:clamp(14px,1.6vw,30px);
    --radius:clamp(16px,1.5vw,30px);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:
      radial-gradient(1200px 700px at 82% -10%,color-mix(in srgb,var(--accent2) 22%,transparent),transparent 70%),
      radial-gradient(1000px 600px at 0% 100%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%),
      var(--bg);
    color:var(--ink);overflow:hidden;font-synthesis:none}
  header{display:flex;align-items:center;justify-content:space-between;gap:2vw;
    padding:clamp(20px,2.6vw,52px) clamp(24px,3.4vw,72px) clamp(8px,1vw,20px)}
  .brand{display:flex;align-items:baseline;gap:.7vw;min-width:0}
  .brand h1{font-size:clamp(24px,2.2vw,48px);font-weight:700;letter-spacing:-.04em;margin:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand h1 b{color:var(--accent)}
  .widgets{display:flex;align-items:center;gap:clamp(16px,2vw,44px);flex-shrink:0}
  .widget{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
  .clock{font-size:clamp(26px,3.1vw,66px);font-weight:650;letter-spacing:-.04em;
    font-variant-numeric:tabular-nums}
  .date,.weather{font-size:clamp(11px,1vw,20px);color:var(--muted);letter-spacing:.02em}
  .weather{color:var(--accent)}
  main{padding:0 clamp(24px,3.4vw,72px) clamp(24px,3vw,60px);height:calc(100% - 10px)}
  .grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap);
    max-height:100%;overflow:auto;padding:6px;scrollbar-width:thin}
  .tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(8px,1vw,22px);aspect-ratio:16/10;min-height:0;text-decoration:none;color:var(--ink);
    background:linear-gradient(160deg,var(--tile-hi),var(--tile));
    border:2px solid #262c3b;border-radius:var(--radius);cursor:pointer;
    transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
    outline:none;overflow:hidden}
  .tile::before{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--tilecolor,#3d7bfd) 42%,transparent),transparent 70%);
    opacity:.7;pointer-events:none}
  .tile .ico{width:clamp(52px,6vw,132px);height:clamp(52px,6vw,132px);border-radius:26%;
    object-fit:contain;position:relative;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35))}
  .tile .glyph{font-size:clamp(40px,5.2vw,116px);line-height:1;position:relative}
  .tile .name{font-size:clamp(14px,1.35vw,30px);font-weight:620;letter-spacing:-.02em;
    position:relative;text-align:center;padding:0 12px;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .cat{position:absolute;top:clamp(10px,1vw,20px);left:clamp(12px,1.1vw,24px);
    font-size:clamp(9px,.75vw,15px);color:var(--muted);letter-spacing:.12em;
    text-transform:uppercase}
  .tile.focus,.tile:focus-visible{transform:scale(1.045);border-color:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 55%,transparent),
               0 24px 60px -18px rgba(0,0,0,.7);z-index:2}
  .empty{grid-column:1/-1;display:grid;place-items:center;gap:18px;color:var(--muted);
    font-size:clamp(16px,1.5vw,28px);text-align:center;padding:8vh 2vw}
  .empty b{color:var(--ink)}
  .hint{position:fixed;bottom:clamp(10px,1.4vw,26px);right:clamp(24px,3.4vw,72px);
    font-size:clamp(10px,.85vw,16px);color:var(--muted);opacity:.75}
  body.light{--bg:#eef0f4;--tile:#ffffff;--tile-hi:#f7f8fb;--ink:#171a22;--muted:#656c7c;
    color-scheme:light}
  body.midnight{--bg:#05060a;--tile:#0f1119;--tile-hi:#151824}
</style>
</head>
<body>
<header>
  <div class="brand"><h1><b>Sidee</b> <span id="title">My TV</span></h1></div>
  <div class="widgets">
    <div class="widget" id="weatherWidget" hidden><span class="weather" id="weather"></span></div>
    <div class="widget" id="dateWidget" hidden><span class="date" id="date"></span></div>
    <div class="widget" id="clockWidget" hidden><span class="clock" id="clock"></span></div>
  </div>
</header>
<main><div class="grid" id="grid" role="list"></div></main>
<div class="hint">← ↑ ↓ → navigate · Enter / OK open · Back to exit</div>
<script>
  const SIDEE = __SIDEE_DATA__;
  const cfg = SIDEE.config || {};
  const apps = Array.isArray(SIDEE.apps) ? SIDEE.apps : [];
  const icons = SIDEE.icons || {};
  document.documentElement.style.setProperty('--accent', cfg.accent || '#ffe600');
  document.documentElement.style.setProperty('--accent2', cfg.accent2 || '#7c5cff');
  document.documentElement.style.setProperty('--cols', Math.max(2, Math.min(8, cfg.columns || 4)));
  document.body.classList.add(['dark','light','midnight'].includes(cfg.theme) ? cfg.theme : 'dark');
  document.getElementById('title').textContent = cfg.title || 'My TV';
  if (cfg.show_clock) { document.getElementById('clockWidget').hidden = false; }
  if (cfg.show_date) { document.getElementById('dateWidget').hidden = false; }
  if (cfg.show_weather) {
    document.getElementById('weatherWidget').hidden = false;
    document.getElementById('weather').textContent = cfg.weather_text || '';
  }

  function tick() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    document.getElementById('date').textContent = now.toLocaleDateString(undefined,
      {weekday:'long', day:'numeric', month:'long'});
  }
  tick(); setInterval(tick, 15000);

  const grid = document.getElementById('grid');
  if (!apps.length) {
    grid.innerHTML = '<div class="empty"><div><b>No apps yet.</b><br>' +
      'Add apps in the Sidee dashboard, then refresh this page.</div></div>';
  } else {
    apps.forEach((app, index) => {
      const a = document.createElement('a');
      a.className = 'tile'; a.href = app.url; a.setAttribute('role', 'listitem');
      a.dataset.index = index; a.style.setProperty('--tilecolor', app.color || '#3d7bfd');
      let inner = '';
      const glyph = icons[app.icon] ? icons[app.icon].glyph : '🌐';
      if (app.image && (app.image.indexOf('data:') === 0 ||
          app.image.indexOf('/icons/') === 0 || app.image.indexOf('http') === 0)) {
        inner = '<img class="ico" alt="" src="' + app.image.replace(/"/g, '&quot;') + '">';
      } else {
        inner = '<div class="glyph">' + glyph + '</div>';
      }
      const label = cfg.show_labels === false ? '' :
        '<div class="name">' + String(app.name).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</div>';
      a.innerHTML = '<span class="cat">' + String(app.category || '') + '</span>' + inner + label;
      a.addEventListener('click', e => { e.preventDefault(); window.location.href = app.url; });
      grid.appendChild(a);
    });
  }

  // TV-remote spatial navigation: arrows move focus, Enter/OK opens the tile.
  const tiles = Array.from(grid.querySelectorAll('.tile'));
  const cols = Math.max(2, Math.min(8, cfg.columns || 4));
  let current = 0;
  function focus(i) {
    if (!tiles.length) return;
    current = Math.max(0, Math.min(tiles.length - 1, i));
    tiles[current].classList.add('focus');
    tiles[current].scrollIntoView({block:'nearest', behavior:'smooth'});
  }
  tiles.forEach((t, i) => {
    t.addEventListener('focus', () => {
      tiles.forEach(x => x.classList.remove('focus'));
      current = i; t.classList.add('focus');
    });
    t.addEventListener('mouseenter', () => focus(i));
  });
  if (tiles.length) focus(0);
  document.addEventListener('keydown', e => {
    const key = e.key || {37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown',13:'Enter'}[e.keyCode];
    let next = current;
    if (key === 'ArrowRight') next = current + 1;
    else if (key === 'ArrowLeft') next = current - 1;
    else if (key === 'ArrowDown') next = current + cols;
    else if (key === 'ArrowUp') next = current - cols;
    else if (key === 'Enter' || key === ' ' || e.keyCode === 13) {
      if (tiles[current]) { e.preventDefault(); window.location.href = tiles[current].href; }
      return;
    } else return;
    e.preventDefault();
    if (next >= 0 && next < tiles.length) focus(next);
  });
</script>
</body>
</html>
